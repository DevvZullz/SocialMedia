<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZullzHosting — Elite Digital Space</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .lux-glass {
            background: linear-gradient(135deg, rgba(20, 20, 24, 0.9) 0%, rgba(10, 10, 12, 0.95) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .lux-input {
            background: rgba(8, 8, 10, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #f3f4f6;
            transition: all 0.3s ease;
        }
        .lux-input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            outline: none;
        }
        .lux-btn-3d {
            background: linear-gradient(135deg, #d4af37 0%, #fef08a 25%, #aa771c 50%, #fdf6b2 75%, #8d6215 100%);
            color: #09090b;
            font-weight: 800;
            box-shadow: 0 6px 0 #5c3e0a, 0 12px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.12s ease;
        }
        .lux-btn-3d:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #5c3e0a, 0 15px 25px rgba(212, 175, 55, 0.4); }
        .lux-btn-3d:active { transform: translateY(4px); box-shadow: 0 2px 0 #5c3e0a, 0 4px 8px rgba(0, 0, 0, 0.5); }
        .nav-btn-3d {
            background: linear-gradient(145deg, rgba(30, 30, 36, 0.95), rgba(15, 15, 18, 0.98));
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.9), 0 8px 12px rgba(0, 0, 0, 0.5);
            transition: all 0.12s ease;
        }
        .nav-btn-3d:active, .nav-btn-3d.active-nav {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.9), 0 3px 6px rgba(0, 0, 0, 0.5);
            border-color: #f59e0b;
            background: linear-gradient(145deg, rgba(50, 41, 15, 0.95), rgba(20, 17, 8, 0.95));
        }
        .gold-text {
            background: linear-gradient(135deg, #f59e0b 0%, #fef08a 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#020203] text-slate-100 min-h-screen relative overflow-x-hidden selection:bg-amber-500 selection:text-slate-950">

    <!-- VIEW 1: LOGIN & REGISTER -->
    <div id="auth-view" style="display: flex;" class="min-h-screen items-center justify-center p-4">
        <div class="lux-glass p-8 sm:p-10 rounded-3xl w-full max-w-md relative overflow-hidden border border-amber-500/30 shadow-2xl">
            <div class="text-center mb-8 space-y-2">
                <div class="inline-block p-3 rounded-2xl bg-amber-500/10 border border-amber-500/30 mb-2 shadow-inner">
                    <span class="text-2xl">👑</span>
                </div>
                <h1 class="text-3xl font-extrabold tracking-widest gold-text">ZullzHosting</h1>
                <p id="auth-subtitle" class="text-xs text-amber-300/70 tracking-widest uppercase font-semibold">Elite Cloud Ecosystem</p>
            </div>
            
            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-2">Username</label>
                    <input type="text" id="auth-username" required class="w-full px-4 py-3.5 rounded-2xl lux-input text-sm" placeholder="Masukkan username...">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="auth-password" required class="w-full px-4 py-3.5 rounded-2xl lux-input text-sm" placeholder="••••••••••••">
                </div>
                <button type="submit" id="auth-btn" class="w-full py-4 lux-btn-3d rounded-2xl text-sm tracking-widest uppercase mt-4">Masuk Ruang Utama</button>
            </form>

            <div class="text-center mt-6">
                <button onclick="toggleAuthMode()" id="auth-toggle-text" class="text-xs text-slate-400 hover:text-amber-400 transition tracking-wide">Belum punya akun? <span class="text-amber-400 font-bold underline underline-offset-4">Daftar Sekarang</span></button>
            </div>
        </div>
    </div>

    <!-- VIEW 2: DASHBOARD UTAMA -->
    <div id="main-view" style="display: none;" class="min-h-screen pb-36">
        
        <!-- Header Atas dengan Tombol Cari di Kanan Atas -->
        <header class="fixed top-0 w-full z-40 lux-glass px-6 py-4 flex justify-between items-center border-b border-amber-500/20 backdrop-blur-2xl">
            <div class="text-base font-black tracking-widest gold-text flex items-center gap-1.5">
                <span>⚡</span> ZullzHosting
            </div>
            <div class="flex items-center gap-3">
                <button onclick="switchTab('pencarian')" class="px-3.5 py-1.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-xs font-bold flex items-center gap-1.5 transition">
                    <span>🔍</span> <span>Cari Akun</span>
                </button>
                <button onclick="handleLogout()" class="text-[11px] bg-red-500/10 text-red-400 font-bold px-3 py-1.5 rounded-xl border border-red-500/20 hover:bg-red-500/30 transition">Keluar</button>
            </div>
        </header>

        <!-- Konten Utama -->
        <main class="pt-28 px-4 max-w-xl mx-auto">

            <!-- TAB 1: BERANDA -->
            <section id="tab-beranda" class="tab-content active space-y-6">
                <!-- Story 24 Jam dengan Dukungan Foto/Video -->
                <div class="lux-glass p-5 rounded-3xl">
                    <div class="flex justify-between items-center mb-4">
                        <p class="text-xs font-bold text-amber-400 uppercase tracking-widest">✨ Story Elite (24 Jam)</p>
                        <label class="cursor-pointer text-[11px] lux-btn-3d px-3 py-1.5 rounded-xl shadow-md inline-flex items-center gap-1">
                            <span>+ Buat Story</span>
                            <input type="file" accept="image/*,video/*" class="hidden" onchange="createStoryMedia(event)">
                        </label>
                    </div>
                    <div id="story-container" class="flex gap-4 overflow-x-auto pb-2 no-scrollbar"></div>
                </div>

                <!-- Tombol Buat Postingan -->
                <div class="lux-glass p-4 rounded-3xl space-y-3">
                    <div class="flex items-center gap-3">
                        <div id="mini-avatar" class="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-300 flex items-center justify-center font-bold text-xs border border-amber-500/30 overflow-hidden flex-shrink-0">U</div>
                        <input type="text" id="post-content" placeholder="Apa yang ingin dibagikan...?" class="w-full px-4 py-2.5 rounded-xl lux-input text-xs">
                    </div>
                    <div class="flex justify-between items-center pt-1 border-t border-amber-500/10">
                        <label class="cursor-pointer inline-flex items-center gap-1.5 text-[11px] text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 px-3 py-1.5 rounded-xl border border-amber-500/30 transition font-semibold">
                            <span>📷 Media</span>
                            <input type="file" id="post-media-file" accept="image/*,video/*" class="hidden" onchange="handleMediaPreview(event)">
                        </label>
                        <button onclick="createPost()" class="px-4 py-2 lux-btn-3d rounded-xl text-[11px] tracking-wider uppercase font-extrabold shadow-md">+ Post</button>
                    </div>
                    <div id="media-preview-container" class="hidden relative rounded-2xl overflow-hidden max-h-40 border border-amber-500/20 mt-2"></div>
                </div>

                <!-- Feed Acak (Randomized) -->
                <div id="global-feed" class="space-y-4"></div>
            </section>

            <!-- TAB 2: PENCARIAN AKUN & SARAN PENGGUNA -->
            <section id="tab-pencarian" class="tab-content space-y-4">
                <div class="lux-glass p-5 rounded-3xl space-y-4">
                    <p class="text-xs font-bold text-amber-400 uppercase tracking-widest">Jelajahi & Cari Akun Pengguna</p>
                    <input type="text" id="search-input" oninput="handleAccountSearch()" placeholder="Ketik nama akun lain..." class="w-full p-3.5 rounded-2xl lux-input text-xs">
                </div>
                <div id="search-results" class="space-y-3"></div>
            </section>

            <!-- TAB 3: DM CHAT REAL-TIME -->
            <section id="tab-chat" class="tab-content space-y-4">
                <div class="lux-glass p-4 rounded-3xl h-[480px] flex flex-col justify-between">
                    <div class="border-b border-amber-500/20 pb-2.5 text-xs font-bold text-amber-400 uppercase tracking-widest flex justify-between items-center">
                        <span>Zullz Secure Chat</span>
                        <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">Live 99.9%</span>
                    </div>
                    <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2.5 py-2 pr-1 text-xs no-scrollbar"></div>
                    <div class="flex gap-2 pt-2.5 border-t border-amber-500/20">
                        <input type="text" id="chat-input" onkeypress="if(event.key==='Enter')sendChatMessage()" placeholder="Kirim pesan..." class="flex-1 p-3 rounded-2xl lux-input text-xs">
                        <button onclick="sendChatMessage()" class="px-5 py-3 lux-btn-3d rounded-2xl text-xs uppercase">Kirim</button>
                    </div>
                </div>
            </section>

            <!-- TAB 4: PROFIL SAYA, PENGATURAN ADMIN & HAPUS AKUN -->
            <section id="tab-tentang" class="tab-content space-y-4">
                <div class="lux-glass p-6 rounded-3xl space-y-5">
                    <div class="text-center space-y-2">
                        <div class="relative w-20 h-20 mx-auto group cursor-pointer" onclick="document.getElementById('profile-avatar-file').click()" title="Ganti Foto Profil">
                            <div id="profile-avatar" class="w-20 h-20 bg-gradient-to-tr from-amber-500/30 to-amber-600/50 text-amber-300 rounded-full flex items-center justify-center text-2xl font-black border-2 border-amber-500 shadow-xl overflow-hidden">U</div>
                            <input type="file" id="profile-avatar-file" accept="image/*" class="hidden" onchange="handleProfileAvatarUpload(event)">
                        </div>
                        <div class="flex items-center justify-center gap-1.5">
                            <h3 id="profile-display-username" class="font-extrabold text-base gold-text">@username</h3>
                            <span id="verified-badge" class="hidden text-amber-400 text-sm font-bold" title="Akun Terverifikasi Centang Biru (>100 Pengikut)">✔</span>
                        </div>
                        <div class="flex justify-center gap-6 pt-2 text-xs">
                            <div class="text-center"><span id="stat-posts" class="font-bold text-amber-300 block text-sm">0</span><span class="text-[10px] text-slate-400 uppercase">Post</span></div>
                            <div class="text-center"><span id="stat-followers" class="font-bold text-amber-300 block text-sm">0</span><span class="text-[10px] text-slate-400 uppercase">Pengikut</span></div>
                            <div class="text-center"><span id="stat-following" class="font-bold text-amber-300 block text-sm">0</span><span class="text-[10px] text-slate-400 uppercase">Mengikuti</span></div>
                        </div>
                    </div>

                    <!-- Konsol Admin Pengikut -->
                    <div class="bg-amber-500/5 border border-amber-500/20 p-3.5 rounded-2xl space-y-2">
                        <p class="text-[11px] font-bold text-amber-400 uppercase tracking-wide">⚙️ Konsol Admin Pengikut</p>
                        <div class="flex gap-2">
                            <input type="number" id="admin-set-followers" placeholder="Atur jumlah pengikut..." class="flex-1 p-2.5 rounded-xl lux-input text-xs">
                            <button onclick="saveAdminFollowers()" class="px-4 py-2.5 lux-btn-3d rounded-xl text-[11px] uppercase">Set</button>
                        </div>
                    </div>

                    <div class="space-y-3 border-t border-amber-500/20 pt-4">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-300 mb-1 uppercase">Nama Lengkap</label>
                            <input type="text" id="edit-fullname" class="w-full px-3.5 py-2.5 rounded-xl lux-input text-xs">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-300 mb-1 uppercase">Bio Elite</label>
                            <textarea id="edit-bio" rows="2" class="w-full p-3.5 rounded-xl lux-input text-xs resize-none"></textarea>
                        </div>
                        <button onclick="updateProfile()" class="w-full py-3 lux-btn-3d rounded-2xl text-xs uppercase">Simpan Perubahan</button>
                        <button onclick="deleteAccount()" class="w-full py-2.5 bg-red-500/10 text-red-400 hover:bg-red-500/20 border border-red-500/30 rounded-2xl text-xs font-bold transition uppercase mt-2">Hapus Akun Permanen</button>
                    </div>
                </div>
            </section>

        </main>

        <!-- NAVBAR 3D BAWAH -->
        <nav class="fixed bottom-3 left-3 right-3 max-w-xl mx-auto z-40 lux-glass px-4 py-2.5 flex justify-around items-center rounded-3xl border border-amber-500/30 shadow-2xl">
            <button onclick="switchTab('beranda')" id="nav-beranda" class="nav-btn-3d active-nav px-4 py-2 rounded-2xl flex flex-col items-center">
                <span class="text-xs font-extrabold text-amber-300">🏠 Beranda</span>
            </button>
            <button onclick="switchTab('pencarian')" id="nav-pencarian" class="nav-btn-3d px-4 py-2 rounded-2xl flex flex-col items-center">
                <span class="text-xs font-extrabold text-slate-300">🔍 Akun</span>
            </button>
            <button onclick="switchTab('chat')" id="nav-chat" class="nav-btn-3d px-4 py-2 rounded-2xl flex flex-col items-center">
                <span class="text-xs font-extrabold text-slate-300">💬 Chat</span>
            </button>
            <button onclick="switchTab('tentang')" id="nav-tentang" class="nav-btn-3d px-4 py-2 rounded-2xl flex flex-col items-center">
                <span class="text-xs font-extrabold text-slate-300">👤 Profil</span>
            </button>
        </nav>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        const SUPABASE_URL = 'https://vdzcjtalvijvylxsgbix.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkemNqdjaltdmlqdnlseHNnYml4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzkxMTMsImV4cCI6MjEwMzM1NTExM30.13pKnsEn52rNylZKmVTw2MdriQ6uG46Cft5z0k6ynjg';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUserData = null;
        let isRegisterMode = false;
        let attachedMediaUrl = '';

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-subtitle').innerText = isRegisterMode ? "Registrasi Anggota Baru" : "Elite Cloud Ecosystem";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "Daftar Akun" : "Masuk Ruang Utama";
            document.getElementById('auth-toggle-text').innerHTML = isRegisterMode ? `Sudah punya akun? <span class="text-amber-400 font-bold underline">Masuk</span>` : `Belum punya akun? <span class="text-amber-400 font-bold underline">Daftar Sekarang</span>`;
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            
            if(!username || !password) {
                alert('Username dan password wajib diisi!');
                return;
            }

            if(isRegisterMode) {
                const { data: existingUser } = await supabaseClient
                    .from('users')
                    .select('username')
                    .eq('username', username)
                    .maybeSingle();

                if(existingUser) {
                    alert('Username sudah digunakan, silakan pilih username lain.');
                    return;
                }

                const { error: insertError } = await supabaseClient
                    .from('users')
                    .insert([{ username, password, followers_count: 0 }]);

                if(insertError) {
                    alert('Gagal mendaftar: ' + insertError.message);
                } else {
                    alert('Registrasi berhasil! Silakan masuk.');
                    toggleAuthMode();
                    document.getElementById('auth-form').reset();
                }
            } else {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .maybeSingle();

                if(error || !data) {
                    alert('Username atau Password salah!');
                } else {
                    currentUserData = data;
                    initDashboard();
                }
            }
        }

        function initDashboard() {
            document.getElementById('auth-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
            refreshUserDataUI();
            fetchPostsRandom();
            fetchStories();
            fetchChats();
            loadAllUsersForDiscovery();
            setupRealtime();
        }

        async function refreshUserDataUI() {
            const { data } = await supabaseClient.from('users').select('*').eq('id', currentUserData.id).maybeSingle();
            if(data) currentUserData = data;

            document.getElementById('profile-display-username').innerText = `@${currentUserData.username}`;
            document.getElementById('edit-fullname').value = currentUserData.fullname || '';
            document.getElementById('edit-bio').value = currentUserData.bio || '';
            document.getElementById('stat-followers').innerText = currentUserData.followers_count || 0;

            const badge = document.getElementById('verified-badge');
            if((currentUserData.followers_count || 0) >= 100) badge.classList.remove('hidden');
            else badge.classList.add('hidden');

            const avatarEl = document.getElementById('profile-avatar');
            const miniAvatarEl = document.getElementById('mini-avatar');
            if(currentUserData.avatar_url) {
                avatarEl.innerHTML = `<img src="${currentUserData.avatar_url}" class="w-full h-full object-cover">`;
                miniAvatarEl.innerHTML = `<img src="${currentUserData.avatar_url}" class="w-full h-full object-cover">`;
            } else {
                avatarEl.innerText = currentUserData.username.charAt(0).toUpperCase();
                miniAvatarEl.innerText = currentUserData.username.charAt(0).toUpperCase();
            }
        }

        function handleLogout() {
            currentUserData = null;
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('auth-view').style.display = 'flex';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active-nav'));
            const targetTab = document.getElementById(`tab-${tabName}`);
            const targetNav = document.getElementById(`nav-${tabName}`);
            if(targetTab && targetNav) {
                targetTab.classList.add('active');
                targetNav.classList.add('active-nav');
            }
        }

        function handleProfileAvatarUpload(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64 = e.target.result;
                    const { error } = await supabaseClient.from('users').update({ avatar_url: base64 }).eq('id', currentUserData.id);
                    if(!error) { currentUserData.avatar_url = base64; refreshUserDataUI(); alert('Foto profil diperbarui!'); }
                    else alert('Gagal memperbarui foto profil.');
                }
                reader.readAsDataURL(file);
            }
        }

        async function updateProfile() {
            const fullname = document.getElementById('edit-fullname').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            const { error } = await supabaseClient.from('users').update({ fullname, bio }).eq('id', currentUserData.id);
            if(!error) alert('Profil diperbarui!');
        }

        async function saveAdminFollowers() {
            const val = parseInt(document.getElementById('admin-set-followers').value);
            if(isNaN(val)) return;
            const { error } = await supabaseClient.from('users').update({ followers_count: val }).eq('id', currentUserData.id);
            if(!error) { alert('Jumlah pengikut berhasil diubah!'); refreshUserDataUI(); }
        }

        async function deleteAccount() {
            if(!confirm("Yakin ingin menghapus akun ini secara permanen?")) return;
            await supabaseClient.from('users').delete().eq('id', currentUserData.id);
            alert('Akun terhapus.');
            handleLogout();
        }

        function handleMediaPreview(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedMediaUrl = e.target.result;
                    const container = document.getElementById('media-preview-container');
                    container.classList.remove('hidden');
                    container.innerHTML = file.type.startsWith('video/') ? `<video src="${attachedMediaUrl}" controls class="w-full h-32 object-cover rounded-2xl"></video>` : `<img src="${attachedMediaUrl}" class="w-full h-32 object-cover rounded-2xl">`;
                }
                reader.readAsDataURL(file);
            }
        }

        async function createPost() {
            const content = document.getElementById('post-content').value.trim();
            if(!content && !attachedMediaUrl) return;
            const { error } = await supabaseClient.from('posts').insert([{ username: currentUserData.username, content, media_url: attachedMediaUrl || null }]);
            if(!error) {
                document.getElementById('post-content').value = '';
                attachedMediaUrl = '';
                document.getElementById('media-preview-container').classList.add('hidden');
                fetchPostsRandom();
            }
        }

        async function fetchPostsRandom() {
            const { data } = await supabaseClient.from('posts').select('*');
            if(data) {
                const shuffled = data.sort(() => 0.5 - Math.random());
                document.getElementById('global-feed').innerHTML = shuffled.map(p => `
                    <div class="lux-glass p-4 rounded-3xl space-y-2.5">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-300 flex items-center justify-center font-bold text-xs border border-amber-500/30">${p.username.charAt(0).toUpperCase()}</div>
                                <span class="text-xs font-bold text-amber-400">@${p.username}</span>
                            </div>
                            ${p.username === currentUserData.username ? `<button onclick="deletePost(${p.id})" class="text-[10px] text-red-400 hover:text-red-300 font-bold px-2 py-1 rounded bg-red-500/10">Hapus</button>` : ''}
                        </div>
                        ${p.content ? `<p class="text-xs text-slate-200">${p.content}</p>` : ''}
                        ${p.media_url ? `<div class="rounded-2xl overflow-hidden border border-amber-500/20">${p.media_url.includes('video') ? `<video src="${p.media_url}" controls class="w-full max-h-60 object-cover"></video>` : `<img src="${p.media_url}" class="w-full max-h-60 object-cover">`}</div>` : ''}
                    </div>
                `).join('');
            }
        }

        async function deletePost(id) {
            await supabaseClient.from('posts').delete().eq('id', id);
            fetchPostsRandom();
        }

        async function createStoryMedia(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    await supabaseClient.from('stories').insert([{ username: currentUserData.username, media_url: e.target.result }]);
                    fetchStories();
                }
                reader.readAsDataURL(file);
            }
        }

        async function fetchStories() {
            const twentyFourHoursAgo = new Date(new Date().getTime() - (24 * 60 * 60 * 1000)).toISOString();
            const { data } = await supabaseClient.from('stories').select('*').gte('created_at', twentyFourHoursAgo);
            if(data) {
                document.getElementById('story-container').innerHTML = data.map(s => `
                    <div class="flex flex-col items-center flex-shrink-0">
                        <div class="w-14 h-14 rounded-full p-[2px] bg-gradient-to-tr from-amber-400 to-purple-600 shadow-lg">
                            <div class="w-full h-full bg-zinc-900 rounded-full flex items-center justify-center overflow-hidden text-xs font-bold text-amber-300">
                                ${s.media_url.includes('image') || s.media_url.startsWith('data:image') ? `<img src="${s.media_url}" class="w-full h-full object-cover">` : s.username.charAt(0)}
                            </div>
                        </div>
                        <span class="text-[10px] mt-1 text-slate-300">@${s.username}</span>
                    </div>
                `).join('');
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if(!message) return;
            await supabaseClient.from('chats').insert([{ username: currentUserData.username, message }]);
            input.value = '';
            fetchChats();
        }

        async function fetchChats() {
            const { data } = await supabaseClient.from('chats').select('*').order('created_at', { ascending: true });
            if(data) {
                const container = document.getElementById('chat-messages');
                container.innerHTML = data.map(c => `
                    <div class="p-2.5 rounded-2xl max-w-[75%] text-xs ${c.username === currentUserData.username ? 'ml-auto bg-amber-500/20 border border-amber-500/30 text-right' : 'lux-glass'}">
                        <div class="flex justify-between items-center gap-2 mb-0.5">
                            <span class="text-[10px] font-bold text-amber-400">@${c.username}</span>
                            ${c.username === currentUserData.username ? `<button onclick="deleteChat(${c.id})" class="text-[9px] text-red-400 hover:underline">Hapus</button>` : ''}
                        </div>
                        <span class="text-slate-200">${c.message}</span>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            }
        }

        async function deleteChat(id) {
            await supabaseClient.from('chats').delete().eq('id', id);
            fetchChats();
        }

        async function loadAllUsersForDiscovery() {
            const { data } = await supabaseClient.from('users').select('username, fullname, followers_count, avatar_url');
            if(data) {
                renderUserList(data.filter(u => u.username !== currentUserData.username));
            }
        }

        async function handleAccountSearch() {
            const keyword = document.getElementById('search-input').value.trim();
            const { data } = await supabaseClient.from('users').select('*').ilike('username', `%${keyword}%`);
            if(data) {
                renderUserList(data.filter(u => u.username !== currentUserData.username));
            }
        }

        function renderUserList(users) {
            const results = document.getElementById('search-results');
            results.innerHTML = users.length === 0 ? `<div class="lux-glass p-6 text-center text-xs text-slate-400 rounded-2xl">Tidak ada akun ditemukan.</div>` : users.map(u => `
                <div class="lux-glass p-3.5 rounded-2xl flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-300 flex items-center justify-center font-bold text-xs overflow-hidden border border-amber-500/30">
                            ${u.avatar_url ? `<img src="${u.avatar_url}" class="w-full h-full object-cover">` : u.username.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <div class="flex items-center gap-1">
                                <h5 class="text-xs font-bold text-amber-300">@${u.username}</h5>
                                ${u.followers_count >= 100 ? `<span class="text-amber-400 text-xs font-bold">✔</span>` : ''}
                            </div>
                            <span class="text-[10px] text-slate-400">${u.followers_count || 0} Pengikut</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function setupRealtime() {
            supabaseClient.channel('zullz-sync-v11')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => fetchPostsRandom())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'chats' }, () => fetchChats())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'stories' }, () => fetchStories())
                .subscribe();
        }
    </script>
</body>
</html>
